<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MythWeaver · 网文续写</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('mythweaver.ui')
          if (!raw) return
          var data = JSON.parse(raw)
          var themes = { mist: 1, ink: 1 }
          var accents = { teal: 1, lagoon: 1, pine: 1, slate: 1 }
          var densities = { regular: 1, compact: 1 }
          var locales = { zh: 'zh-CN', en: 'en' }
          var root = document.documentElement
          root.dataset.theme = themes[data.theme] ? data.theme : 'mist'
          root.dataset.accent = accents[data.accent] ? data.accent : 'teal'
          root.dataset.density = densities[data.density] ? data.density : 'regular'
          if (locales[data.locale]) root.lang = locales[data.locale]
        } catch (e) {}
      })()
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d7377'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' fill='%23f4f7f8' font-family='serif'%3E织%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,550;9..144,700&family=Manrope:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
