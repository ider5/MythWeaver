# 一条命令启动 API + 前端。
# 密钥放在可选的 backend/.env，启动时注入，不写入镜像。
# /api/health 在数据库可写时返回 HTTP 200；未配置模型时 ready 为 false，界面仍可打开。

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATA_DIR: /data
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      DEBUG: "false"
    volumes:
      - mythweaver-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  mythweaver-data:
