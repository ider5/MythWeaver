services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - ./backend/.env
    environment:
      DATA_DIR: /data
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      DEBUG: "false"
    volumes:
      - mythweaver-data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mythweaver-data:
